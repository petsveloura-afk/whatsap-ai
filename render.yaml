# Render Blueprint - FREE web service. Database: use a free external Postgres (Neon or Supabase free tier).
services:
  - type: web
    name: smart-sniper-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false          # paste your Neon/Supabase connection string
      - key: JWT_SECRET
        generateValue: true
      - key: SUPER_ADMIN_EMAILS
        sync: false
      - key: CORS_ORIGINS
        sync: false          # your Vercel URL
      - key: APP_URL
        sync: false          # your Vercel URL
